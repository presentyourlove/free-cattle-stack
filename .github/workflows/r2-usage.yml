name: r2-usage
# Safeguard 6: daily R2 usage check for bucket free-cattle-files.
# At 80% or more of the 10 GB free tier this opens an alert issue.
# At 90% or more the run also fails, so GitHub emails the owner.
on:
  schedule:
    - cron: "23 4 * * *"   # daily, 04:23 UTC
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check R2 storage usage
        id: r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 scripts/r2_usage_check.py
      - name: Open alert issue at 80 percent or more
        if: steps.r2.outputs.level == 'warn80' || steps.r2.outputs.level == 'warn90' || steps.r2.outputs.level == 'warn95'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "R2 usage alert: ${{ steps.r2.outputs.level }} - storage ${{ steps.r2.outputs.storage_gb }} GB of 10 GB free" \
            --body "The daily R2 check for bucket free-cattle-files reported level ${{ steps.r2.outputs.level }} with storage at ${{ steps.r2.outputs.storage_gb }} GB. See the r2-usage workflow run for the full report. Safeguard lines: 80% notify, 90% urgent, 95% clear the oldest files under outputs/."
      - name: Fail the run at 90 percent or more
        if: steps.r2.outputs.level == 'warn90' || steps.r2.outputs.level == 'warn95'
        run: |
          echo "::error::R2 storage at ${{ steps.r2.outputs.storage_gb }} GB is over the 90 percent safeguard line."
          exit 1
      - name: Heartbeat to healthchecks.io (dead-man's switch)
        env:
          HC_PING_URL: ${{ secrets.HC_PING_R2 }}
        run: |
          if [ -n "$HC_PING_URL" ]; then
            curl -fsS -m 10 "$HC_PING_URL" > /dev/null && echo "healthchecks heartbeat sent"
          else
            echo "HC_PING_R2 secret not set yet - heartbeat skipped"
          fi
